# ---------------------------------------------------------------------------
# Pipeline Merge Gate — Reusable PR quality gate for main/release branches
# Runs security, governance, license, and build checks on every PR
# ---------------------------------------------------------------------------
name: "Pipeline Merge Gate"

on:
  pull_request:
    branches: [main, "release/*"]
    types: [opened, synchronize, reopened]

concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  API_BASE_URL: ${{ vars.DEMO_SERVER_URL || 'http://localhost:3000' }}

# ---------------------------------------------------------------------------
# Job 1 — Security Scan (CodeQL)
# ---------------------------------------------------------------------------
jobs:
  security-scan:
    name: "🔒 Security Scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      scan_status: ${{ steps.scan.outputs.status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Run CodeQL analysis
        id: codeql
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

      - name: Check for new vulnerabilities in PR diff
        id: scan
        uses: actions/github-script@v7
        with:
          script: |
            // Check code scanning alerts for this PR's head SHA
            try {
              const alerts = await github.rest.codeScanning.listAlertsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.payload.pull_request.head.ref,
                state: 'open',
                per_page: 10,
              });

              const newAlerts = alerts.data.length;
              core.setOutput('status', newAlerts === 0 ? 'passed' : 'warning');
              core.setOutput('alert_count', newAlerts);
              console.log(`🔒 ${newAlerts} open code scanning alert(s) on this branch`);
            } catch (err) {
              // Code scanning may not be enabled
              core.setOutput('status', 'skipped');
              core.setOutput('alert_count', 0);
              console.log(`⏭️ Code scanning not available: ${err.message}`);
            }

  # ---------------------------------------------------------------------------
  # Job 2 — Governance Check
  # ---------------------------------------------------------------------------
  governance-check:
    name: "📋 Governance Check"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      governance_status: ${{ steps.gov.outputs.status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get changed files
        id: files
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const paths = files.data.map(f => f.filename);
            core.setOutput('list', JSON.stringify(paths));
            console.log(`📂 ${paths.length} changed file(s)`);

      - name: Call governance API
        id: gov
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          FILES='${{ steps.files.outputs.list }}'

          echo "📋 Running governance checks on PR #${PR_NUMBER}..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${API_BASE_URL}/api/governance/check/${PR_NUMBER}" \
            -H "Content-Type: application/json" \
            -d "{\"changedFiles\": ${FILES}}" 2>/dev/null) || true

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "200" ]; then
            STATUS=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('overallStatus','unknown'))" 2>/dev/null || echo "unknown")
            echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
            echo "✅ Governance: ${STATUS}"
          else
            echo "⚠️ Governance API not reachable — skipping"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Job 3 — License Check
  # ---------------------------------------------------------------------------
  license-check:
    name: "📜 License Compliance"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      license_status: ${{ steps.license.outputs.status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts 2>/dev/null || true

      - name: Call license audit API
        id: license
        run: |
          echo "📜 Running license compliance check..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET \
            "${API_BASE_URL}/api/governance/license-audit" 2>/dev/null) || true

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "200" ]; then
            VIOLATIONS=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('data',{}).get('violations',[])))" 2>/dev/null || echo "0")
            if [ "$VIOLATIONS" = "0" ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
              echo "✅ No license violations"
            else
              echo "status=warning" >> "$GITHUB_OUTPUT"
              echo "⚠️ ${VIOLATIONS} license violation(s) found"
            fi
          else
            # Fallback: run license-checker locally
            echo "⚠️ License API not available — running local check"
            if npx license-checker --summary 2>/dev/null; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=skipped" >> "$GITHUB_OUTPUT"
            fi
          fi

  # ---------------------------------------------------------------------------
  # Job 4 — Test Suite (scaffold)
  # ---------------------------------------------------------------------------
  test-suite:
    name: "🧪 Build & Test"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      test_status: ${{ steps.test.outputs.status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts 2>/dev/null || true

      - name: Build project
        id: build
        run: |
          if npm run build 2>&1; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests (scaffolded — no test suite yet)
        id: test
        run: |
          # No test suite exists yet; scaffold the step for future use
          if npm test 2>/dev/null; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ No test suite configured — marking as skipped"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Job 5 — Gate Verdict
  # ---------------------------------------------------------------------------
  gate-verdict:
    name: "🏁 Merge Gate Verdict"
    needs: [security-scan, governance-check, license-check, test-suite]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      statuses: write
    steps:
      - name: Aggregate results and determine verdict
        id: verdict
        run: |
          SECURITY="${{ needs.security-scan.outputs.scan_status || 'skipped' }}"
          GOVERNANCE="${{ needs.governance-check.outputs.governance_status || 'skipped' }}"
          LICENSE="${{ needs.license-check.outputs.license_status || 'skipped' }}"
          BUILD="${{ needs.test-suite.outputs.test_status || 'skipped' }}"

          echo "📊 Gate Results:"
          echo "  Security: ${SECURITY}"
          echo "  Governance: ${GOVERNANCE}"
          echo "  License: ${LICENSE}"
          echo "  Build/Test: ${BUILD}"

          FAILED=false

          if [ "$SECURITY" = "failed" ]; then FAILED=true; fi
          if [ "$GOVERNANCE" = "failed" ] || [ "$GOVERNANCE" = "rejected" ]; then FAILED=true; fi
          if [ "$LICENSE" = "failed" ]; then FAILED=true; fi
          if [ "$BUILD" = "failed" ]; then FAILED=true; fi

          if [ "$FAILED" = "true" ]; then
            echo "verdict=failed" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=passed" >> "$GITHUB_OUTPUT"
          fi

      - name: Post gate summary on PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 🏁 Pipeline Merge Gate — ${{ steps.verdict.outputs.verdict == 'passed' && '✅ PASSED' || '❌ FAILED' }}

            | Check | Status |
            |-------|--------|
            | 🔒 Security Scan | ${{ needs.security-scan.outputs.scan_status || 'skipped' }} |
            | 📋 Governance | ${{ needs.governance-check.outputs.governance_status || 'skipped' }} |
            | 📜 License Compliance | ${{ needs.license-check.outputs.license_status || 'skipped' }} |
            | 🧪 Build & Test | ${{ needs.test-suite.outputs.test_status || 'skipped' }} |
            | **Verdict** | **${{ steps.verdict.outputs.verdict }}** |

            ---
            _Merge Gate — [Run #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_

      - name: Set commit status
        uses: actions/github-script@v7
        with:
          script: |
            const verdict = '${{ steps.verdict.outputs.verdict }}';
            const sha = context.payload.pull_request.head.sha;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: verdict === 'passed' ? 'success' : 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: verdict === 'passed'
                ? 'All merge gates passed'
                : 'One or more merge gates failed',
              context: 'Pipeline Merge Gate',
            });

      - name: Write workflow summary
        run: |
          {
            echo "# 🏁 Pipeline Merge Gate"
            echo ""
            echo "**PR:** #${{ github.event.pull_request.number }}"
            echo "**Verdict:** ${{ steps.verdict.outputs.verdict }}"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Security Scan | ${{ needs.security-scan.outputs.scan_status || 'skipped' }} |"
            echo "| Governance | ${{ needs.governance-check.outputs.governance_status || 'skipped' }} |"
            echo "| License | ${{ needs.license-check.outputs.license_status || 'skipped' }} |"
            echo "| Build & Test | ${{ needs.test-suite.outputs.test_status || 'skipped' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if gate did not pass
        if: steps.verdict.outputs.verdict != 'passed'
        run: |
          echo "❌ Merge gate failed — PR should not be merged"
          exit 1
