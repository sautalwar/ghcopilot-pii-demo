name: "Security Governance Gate"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to check"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  security-events: read
  issues: read
  checks: write

jobs:
  governance:
    name: "Security Governance Checks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get PR info
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Get changed files
        id: files
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.pr.outputs.number }}');
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });
            const filePaths = files.data.map(f => f.filename);
            core.setOutput('list', JSON.stringify(filePaths));
            console.log(`Found ${filePaths.length} changed files`);

      - name: Run governance checks
        id: checks
        env:
          DEMO_SERVER_URL: ${{ vars.DEMO_SERVER_URL || 'http://localhost:3000' }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          CHANGED_FILES='${{ steps.files.outputs.list }}'
          
          echo "🔍 Running governance checks on PR #${PR_NUMBER}..."
          
          RESULT=$(curl -s -X POST "${DEMO_SERVER_URL}/api/governance/check/${PR_NUMBER}" \
            -H "Content-Type: application/json" \
            -d "{\"changedFiles\": ${CHANGED_FILES}}" 2>/dev/null)
          
          if [ -z "$RESULT" ]; then
            echo "⚠️ Governance server not reachable — running local checks"
            echo "status=skipped" >> $GITHUB_OUTPUT
            echo "details=Governance server not available" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "$RESULT" | tee governance-report.json
          
          STATUS=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('overallStatus','unknown'))" 2>/dev/null || echo "unknown")
          echo "status=${STATUS}" >> $GITHUB_OUTPUT

      - name: Post PR comment
        if: steps.checks.outputs.status != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const status = '${{ steps.checks.outputs.status }}';
            const prNumber = parseInt('${{ steps.pr.outputs.number }}');
            
            let reportText = '';
            try {
              const report = JSON.parse(fs.readFileSync('governance-report.json', 'utf8'));
              const data = report.data || report;
              const checks = data.checks || [];
              
              const icon = status === 'certified' ? '✅' : '❌';
              reportText = `## ${icon} Security Governance Report\n\n`;
              reportText += `**Status:** ${status.toUpperCase()}\n\n`;
              reportText += `| Check | Status | Details |\n|-------|--------|--------|\n`;
              
              for (const check of checks) {
                const checkIcon = check.status === 'passed' ? '✅' : 
                                  check.status === 'failed' ? '❌' : 
                                  check.status === 'pending' ? '⏳' : '⏭️';
                reportText += `| ${check.name} | ${checkIcon} ${check.status} | ${check.details} |\n`;
              }
              
              reportText += `\n---\n_Generated by Security Governance Gate_`;
            } catch (e) {
              reportText = `## Security Governance Report\n\nStatus: ${status}\n\n_Could not parse detailed report_`;
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: reportText,
            });

      - name: Set check status
        if: always()
        run: |
          STATUS="${{ steps.checks.outputs.status }}"
          if [ "$STATUS" = "certified" ] || [ "$STATUS" = "skipped" ]; then
            echo "✅ Governance checks passed"
            exit 0
          else
            echo "❌ Governance checks failed — PR should not be merged"
            exit 1
          fi
